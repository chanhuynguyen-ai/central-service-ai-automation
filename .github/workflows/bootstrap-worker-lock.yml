name: Bootstrap notification worker dependency lock

on:
  push:
    branches: [feat/async-notifications]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Add Dramatiq Redis worker dependency and refresh uv lock
        run: |
          cd backend
          uv add 'dramatiq[redis]>=1.17,<2.0'
          grep -qxF 'dramatiq[redis]>=1.17,<2.0' requirements.txt || printf '\ndramatiq[redis]>=1.17,<2.0\n' >> requirements.txt
      - name: Commit refreshed dependency metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/pyproject.toml backend/uv.lock backend/requirements.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(deps): add Redis notification worker runtime'
          git push origin HEAD:feat/async-notifications
