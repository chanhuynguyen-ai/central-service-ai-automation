name: M4 source verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-snapshot:
    if: github.head_ref == 'feat/request-timeline-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: m4-verification-source
          path: source.zip
          retention-days: 1
